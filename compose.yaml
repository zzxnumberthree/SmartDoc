services:
  # 1. 数据库服务
  db:
    image: mysql:8.0
    container_name: aisdms-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # 演示用密码，生产环境应通过.env配置
      MYSQL_DATABASE: ai_sdms_db         # 自动创建的数据库名
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306" # 将容器的3306映射到宿主机的3307，避免和你本地MySQL冲突
    volumes:
      - db_data:/var/lib/mysql # 数据持久化，防止重启后数据丢失
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 2. 你的 Spring Boot 应用
  app:
    build: . # 使用当前目录的 Dockerfile 构建
    container_name: aisdms-app
    ports:
      - "8080:8080"
    depends_on:
      - db # 确保数据库先启动
    environment:
      # 覆盖 application.yml 中的配置
      # 注意：这里的 host 必须写 'db' (服务名)，不能写 localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ai_sdms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      # 将 Gemini API Key 作为环境变量传入 (安全！)
      GEMINI_API_KEY: ${GEMINI_API_KEY}

volumes:
  db_data: