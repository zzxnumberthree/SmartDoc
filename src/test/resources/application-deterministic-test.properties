spring.datasource.url=jdbc:h2:mem:smartdoc-deterministic;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.docker.compose.enabled=false

# The deterministic suite supplies ChatModel and EmbeddingModel test doubles.
spring.ai.model.chat=none
ai.proxy.enabled=false
smartdoc.vector-store.file=target/deterministic-test/vector_store.json
smartdoc.upload-dir=target/deterministic-test/uploads

jwt.secret=deterministic-test-secret-that-is-long-enough-for-hmac-sha-signing-1234567890
logging.level.root=WARN
logging.level.com.spe.smartdocjp=INFO
