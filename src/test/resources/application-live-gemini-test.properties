spring.datasource.url=jdbc:h2:mem:smartdoc-live-smoke;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.docker.compose.enabled=false

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
ai.proxy.enabled=false
smartdoc.vector-store.file=target/live-gemini-test/vector_store.json
smartdoc.upload-dir=target/live-gemini-test/uploads

jwt.secret=live-smoke-test-secret-that-is-long-enough-for-hmac-sha-signing-1234567890
