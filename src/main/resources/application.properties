spring.application.name=SmartDoc-JP

spring.datasource.url=jdbc:mysql://localhost:3306/smart_doc_db?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jackson.time-zone=Asia/Tokyo

spring.docker.compose.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Proxy Settings (Optional)
ai.proxy.host=127.0.0.1
ai.proxy.port=7890
ai.proxy.enabled=true

spring.ai.model.chat=google-genai

spring.ai.google.genai.chat.options.model=gemini-2.5-flash

spring.ai.google.genai.chat.options.temperature=0.3

spring.servlet.multipart.resolve-lazily=true

logging.level.com.spe.smartdocjp.aspect=INFO
logging.level.root=INFO

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# AI Cost Control & Limits (Daily total tokens upper limit)
smartdoc.ai.daily-token-limit=500000

# Security & JWT Settings
jwt.secret=${JWT_SECRET:89uV2B8R3d4e9jP3bA2F7k6N1y8Q4z5W0c7T9m4K5u2X8a3F9p1H7v2J5k6N9m3}
jwt.expiration=86400000


